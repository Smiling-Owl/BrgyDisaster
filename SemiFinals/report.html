<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Page</title>
  <link rel="stylesheet" href="report.css">
  <script defer src="back.js"></script>
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="landingPage.html" class="back-btn">Back</a> 
    <ul class="nav-links">
      <li><a href="aboutUs.html">About Us</a></li> 
      <li><a href="report.html">Report</a></li>
      <li><a href="userReportHistory.html">My Reports</a></li>
      <li><a href="help.html">Help</a></li>
      <li class="dropdown"><a href="contact.html">Contacts ▾</a></li>
    </ul>
  </nav>

  <!-- Google Form Style Container -->
  <div class="form-container">
    <div class="form-header">
      <h1>Disaster Report Form</h1>
      <p class="form-description">Please fill out the form below to report a disaster or emergency situation.</p>
    </div>

    <form class="google-form" id="reportForm">
      <div class="form-section">
        <h2>Report Incident</h2>
        
        <div class="form-group">
          <label for="reporter-name" class="form-label">Reporter Name <span class="required">*</span></label>
          <input type="text" id="reporter-name" name="reporter-name" class="form-input" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label for="date" class="form-label">Date</label>
          <input type="date" id="date" name="date" class="form-input" required>
        </div>

        <div class="form-group">
          <label for="time" class="form-label">Time</label>
          <input type="time" id="time" name="time" class="form-input" required>
        </div>

        <div class="form-group">
          <label for="disaster-category" class="form-label">Disaster Category <span class="required">*</span></label>
          <select id="disaster-category" name="disaster-category" class="form-select" required>
            <option value="">Select Category</option>
            <option value="flood">Flood</option>
            <option value="fire">Fire</option>
            <option value="earthquake">Earthquake</option>
            <option value="typhoon">Typhoon</option>
            <option value="landslide">Landslide</option>
            <option value="storm">Storm</option>
            <option value="drought">Drought</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="barangay" class="form-label">Barangay <span class="required">*</span></label>
          <input type="text" id="barangay" name="barangay" class="form-input" placeholder="Enter barangay name" required>
        </div>

        <div class="form-group">
          <label for="location" class="form-label">Location <span class="required">*</span></label>
          <input type="text" id="location" name="location" class="form-input" placeholder="Pin location or enter address" required>
        </div>

        <div class="form-group">
          <label for="areas-affected" class="form-label">Areas Affected</label>
          <input type="text" id="areas-affected" name="areas-affected" class="form-input" placeholder="e.g., Purok 1, Purok 2, Main Street">
        </div>
      </div>

      <div class="form-section">
        <h2>Affected Population</h2>
        
        <div class="form-group">
          <label for="affected-individuals" class="form-label">Number of Affected Individuals</label>
          <input type="number" id="affected-individuals" name="affected-individuals" class="form-input" placeholder="Enter number" min="0">
        </div>

        <div class="form-group">
          <label for="affected-families" class="form-label">Number of Affected Families</label>
          <input type="number" id="affected-families" name="affected-families" class="form-input" placeholder="Enter number" min="0">
        </div>

        <div class="form-row">
          <div class="form-group half-width">
            <label for="minors" class="form-label">Minors</label>
            <input type="number" id="minors" name="minors" class="form-input" value="0" min="0">
          </div>
          <div class="form-group half-width">
            <label for="seniors" class="form-label">Seniors</label>
            <input type="number" id="seniors" name="seniors" class="form-input" value="0" min="0">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group half-width">
            <label for="pregnant" class="form-label">Pregnant</label>
            <input type="number" id="pregnant" name="pregnant" class="form-input" value="0" min="0">
          </div>
          <div class="form-group half-width">
            <label for="lactating" class="form-label">Lactating</label>
            <input type="number" id="lactating" name="lactating" class="form-input" value="0" min="0">
          </div>
        </div>

        <div class="form-group">
          <label for="injured" class="form-label">Number of Injured</label>
          <input type="number" id="injured" name="injured" class="form-input" placeholder="Enter number" min="0">
        </div>
      </div>

      <div class="form-section">
        <h2>Damage & Evacuation</h2>
        <h3>Damage Assessment</h3>
        
        <div class="form-group">
          <label for="damage-description" class="form-label">Damage Description</label>
          <textarea id="damage-description" name="damage-description" class="form-textarea" placeholder="Describe the extent of damage to properties, infrastructure, etc." rows="3"></textarea>
        </div>

        <div class="form-group">
          <label for="evacuation-needed" class="form-label">Evacuation Required</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="evacuation-needed" value="yes">
              <span class="radio-text">Yes</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="evacuation-needed" value="no">
              <span class="radio-text">No</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="evacuation-needed" value="partial">
              <span class="radio-text">Partial</span>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="additional-info" class="form-label">Additional Information</label>
          <textarea id="additional-info" name="additional-info" class="form-textarea" placeholder="Any other relevant information about the incident" rows="3"></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" onclick="clearForm()">Clear Form</button>
        <button type="submit" class="btn-primary">Submit Report</button>
      </div>
    </form>
  </div>

  <!-- Popup Modal -->
  <div id="popupModal" class="popup-modal">
    <div class="popup-content">
      <div class="popup-header">
      </div>
      <div class="popup-body">
        <p>Is the provided information correct?</p>
        <div class="popup-buttons">
          <button id="confirmYes" class="btn-yes">Yes</button>
          <button id="confirmNo" class="btn-no">No/Go Back</button>
        </div>
      </div>
    </div>
  </div>

  <script src="reportDataManager.js"></script>
  <script src="report.js"></script>
</body>
</html>
