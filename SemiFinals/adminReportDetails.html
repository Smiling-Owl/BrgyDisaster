<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Details</title>
  <link rel="stylesheet" href="adminReports.css">
  <script defer src="back.js"></script>
</head>
<body>
  <nav class="navbar">
    <ul class="nav-links">
      <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
      <li><a href="adminHome.html" class="nav-link active">Admin Home Page</a></li>
      <li><a href="adminSummary.html" class="nav-link">Summary</a></li>
    </ul>
  </nav>

  <main class="details-main">
    <h2 id="reportTitle">Admin Report Details</h2>

    <div id="reportDetailsCard" class="details-card">
      <div class="header">
        <span id="statusBadge" class="status-badge pending">Pending</span>
        <span id="reportId" style="margin-left:10px">#</span>
      </div>
      <div class="content">
        <p><strong>Reporter Name:</strong> <span id="reporterName">-</span></p>
        <p><strong>Reporter Contact Info:</strong> <span id="contactInfo">-</span></p>
        <p><strong>Reporting Location:</strong> <span id="location">-</span></p>
        <p><strong>Incident Type:</strong> <span id="incidentType">-</span></p>
        <p><strong>Severity:</strong> <span id="severity">-</span></p>
        <p><strong>Urgency:</strong> <span id="urgency">-</span></p>
        <p><strong>People Affected:</strong> <span id="peopleAffected">0</span></p>
        <p><strong>Submitted:</strong> <span id="submittedDate">-</span></p>
        <p><strong>Report Description</strong></p>
        <div id="description" class="desc-placeholder">-</div>
      </div>
      <div id="actionButtons" class="actions">
        <button id="verifyBtn" class="btn primary">Verify</button>
        <button id="dismissBtn" class="btn outline">Dismiss</button>
      </div>
    </div>
  </main>

  <!-- Verify Modal -->
  <div id="verifyModal" class="modal">
    <div class="modal-content">
      <div class="modal-header"></div>
      <div class="modal-body">
        <p>Verify Report?</p>
        <div class="modal-actions">
          <button class="btn primary" data-close>Yes</button>
          <button class="btn outline" data-close>No/Go Back</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Dismiss Modal -->
  <div id="dismissModal" class="modal">
    <div class="modal-content">
      <div class="modal-header"></div>
      <div class="modal-body">
        <p>Dismiss Report?</p>
        <div class="modal-actions">
          <button class="btn primary" data-close>Yes</button>
          <button class="btn outline" data-close>No/Go Back</button>
        </div>
      </div>
    </div>
  </div>

  <script src="reportDataManager.js"></script>

</body>
</html>
