<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report View</title>
  <link rel="stylesheet" href="adminReports.css">
  <script defer src="back.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="adminHome.html" class="back-btn">Back</a>
    <h2 class="nav-title">Report View</h2>
    <ul class="nav-links">
      <li><a href="#" class="nav-link active">Report</a></li>
      <li><a href="adminSummary.html" class="nav-link">Summary</a></li>
    </ul>
  </nav>

  <div class="main-container">
    <!-- Sidebar with filters -->
    <aside class="sidebar">
      <div class="filter-section">
        <h3>Filter Reports</h3>
        <div class="filter-options">
          <button class="filter-btn active" data-filter="all">All Reports</button>
          <button class="filter-btn" data-filter="pending">Pending</button>
          <button class="filter-btn" data-filter="verified">Verified</button>
        </div>
      </div>
      
      <div class="stats-section">
        <h3>Quick Stats</h3>
        <div class="stat-item">
          <span class="stat-label">Total Reports:</span>
          <span class="stat-value" id="total-count">6</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Pending:</span>
          <span class="stat-value" id="pending-count">3</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Verified:</span>
          <span class="stat-value" id="verified-count">3</span>
        </div>
      </div>
    </aside>

    <!-- Main content area -->
    <main class="reports-main">
      <div class="reports-header">
        <h2>Report View</h2>
      </div>

      <div class="report-grid" id="report-grid">
        <!-- Reports will be dynamically loaded here -->
      </div>
    </main>
  </div>

  <script src="reportDataManager.js"></script>
  <script src="adminReports.js"></script>
</body>
</html>
